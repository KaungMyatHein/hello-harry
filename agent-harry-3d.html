<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Harry — 3D Office</title>
<style>
  :root {
    --primary-on-dark: #2997ff;
    --ink: #1d1d1f;
    --ink-muted-48: #7a7a7a;
    --canvas: #ffffff;
    --c-orchestrator: #0066cc;
    --c-discovery: #5e81ac;
    --c-competitive: #2c7d6f;
    --c-positioner: #d97706;
    --c-prioritizer: #b45309;
    --c-ideation: #8b5cf6;
    --c-lo-fi: #06b6d4;
    --c-figma: #a855f7;
    --c-engineer: #ec4899;
    --c-usability: #16a34a;
    --c-handoff: #525252;
    --c-critique: #dc2626;
    --c-strategist: #0891b2;
    --c-launch: #c2410c;
    --c-metrics: #65a30d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    color: var(--ink);
  }
  /* Hidden agent SVGs — the three.js script reads rect data out of these
     to build voxel characters. display:none doesn't break querySelector. */
  .ag-grid { display: none; }

  /* Chat bubble layer */
  .hero-chat-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 2;
  }
  .hero-chat-3d {
    --c: #0066cc;
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -120%);
    max-width: 240px;
    min-width: 120px;
    padding: 7px 11px 8px;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(15, 23, 42, 0.08);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 11.5px;
    line-height: 1.38;
    color: #1f2937;
    opacity: 0;
    transition: opacity 320ms ease;
    will-change: transform, opacity;
  }
  .hero-chat-3d.show { opacity: 1; }
  .hero-chat-3d::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    transform: translateX(-50%);
    width: 14px; height: 7px;
    background: rgba(255, 255, 255, 0.96);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-bottom: 1px solid rgba(15, 23, 42, 0.08);
  }
  .hero-chat-3d-name {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--c);
    margin-bottom: 2px;
  }
  .hero-chat-3d-name::before {
    content: "";
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--c);
    box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.85);
  }
  .hero-chat-3d-text {
    display: block;
    color: #1f2937;
    font-family: "SF Pro Text", system-ui, sans-serif;
  }
  @media (max-width: 720px) {
    .hero-chat-3d { font-size: 10.5px; max-width: 180px; min-width: 100px; padding: 6px 9px 7px; }
    .hero-chat-3d-name { font-size: 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-chat-3d { transition: opacity 160ms linear; }
  }

  /* Hero 3D office scene — full-bleed inside iframe */
  .hero-room {
    width: 100%;
    height: 100%;
    position: relative;
  }
  .hero-room-stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 50% 20%, #f8efd9 0%, #ece2c9 45%, #d8cdb1 100%);
  }
  .hero-room canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }
  .hero-room-loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: "SF Pro Text", system-ui, sans-serif;
    font-size: 12px;
    color: var(--ink-muted-48);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-weight: 600;
    pointer-events: none;
    transition: opacity .6s ease;
  }
  .hero-room.ready .hero-room-loading { opacity: 0; }
  .hero-room-tooltip {
    position: absolute;
    left: 0; top: 0;
    pointer-events: none;
    padding: 6px 10px;
    background: rgba(15, 23, 42, 0.92);
    color: #fff;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2px;
    border-radius: 6px;
    transform: translate(-50%, -140%);
    opacity: 0;
    transition: opacity .12s ease;
    white-space: nowrap;
    z-index: 4;
    box-shadow: 0 6px 18px -6px rgba(0, 0, 0, 0.4);
  }
  .hero-room-tooltip.show { opacity: 1; }
</style>
</head>
<body>

  function extractPixels(svg) {
    const pixels = [];
    if (!svg) return pixels;
    svg.querySelectorAll('rect').forEach(rect => {
      const x = parseInt(rect.getAttribute('x') || '0', 10);
      const y = parseInt(rect.getAttribute('y') || '0', 10);
      const w = parseInt(rect.getAttribute('width') || '1', 10);
      const h = parseInt(rect.getAttribute('height') || '1', 10);
      let fill = rect.getAttribute('fill');
      if (!fill || fill === 'none') {
        let p = rect.parentNode;
        while (p && p.getAttribute && (!fill || fill === 'none')) {
          fill = p.getAttribute('fill');
          p = p.parentNode;
        }
      }
      if (!fill || fill === 'none') return;
      const opacity = parseFloat(rect.getAttribute('opacity') || '1');
      if (opacity < 0.3) return;
      for (let dx = 0; dx < w; dx++) {
        for (let dy = 0; dy < h; dy++) {
          pixels.push({ x: x + dx, y: y + dy, color: fill });
        }
      }
    });
    return pixels;
  }

  function buildCharacter(pixels) {
    const wrapper = new THREE.Group();
    const inner = new THREE.Group();
    if (pixels.length === 0) { wrapper.add(inner); return { wrapper, inner }; }

    const byColor = new Map();
    pixels.forEach(p => {
      const c = p.color.toLowerCase();
      if (!byColor.has(c)) byColor.set(c, []);
      byColor.get(c).push(p);
    });

    const geo = new THREE.BoxGeometry(VOXEL * 1.02, VOXEL * 1.02, VOXEL * 1.4);
    byColor.forEach((pxs, color) => {
      const mat = new THREE.MeshLambertMaterial({ color });
      const mesh = new THREE.InstancedMesh(geo, mat, pxs.length);
      pxs.forEach((p, i) => {
        const m = new THREE.Matrix4();
        m.setPosition((p.x - 7.5) * VOXEL, (15 - p.y) * VOXEL + VOXEL / 2, 0);
        mesh.setMatrixAt(i, m);
      });
      mesh.instanceMatrix.needsUpdate = true;
      inner.add(mesh);
    });

    wrapper.add(inner);
    return { wrapper, inner };
  }

  function buildOffice(scene) {
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 24),
      new THREE.MeshLambertMaterial({ color: '#d9c9a8' })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    for (let i = -9; i <= 9; i += 2) {
      const plank = new THREE.Mesh(
        new THREE.PlaneGeometry(1.8, 24),
        new THREE.MeshLambertMaterial({ color: '#c8b48a' })
      );
      plank.rotation.x = -Math.PI / 2;
      plank.position.set(i, 0.005, 0);
      scene.add(plank);
    }

    const runnerBorder = new THREE.Mesh(
      new THREE.PlaneGeometry(2.8, 9.6),
      new THREE.MeshLambertMaterial({ color: '#7da3c8' })
    );
    runnerBorder.rotation.x = -Math.PI / 2;
    runnerBorder.position.set(0, 0.015, -2.5);
    scene.add(runnerBorder);
    const runner = new THREE.Mesh(
      new THREE.PlaneGeometry(2.4, 9.2),
      new THREE.MeshLambertMaterial({ color: '#a8c7e8' })
    );
    runner.rotation.x = -Math.PI / 2;
    runner.position.set(0, 0.02, -2.5);
    scene.add(runner);

    const backWall = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 16),
      new THREE.MeshLambertMaterial({ color: '#f0eee4' })
    );
    backWall.position.set(0, 7, -9);
    scene.add(backWall);

    const trim = new THREE.Mesh(
      new THREE.BoxGeometry(40, 0.3, 0.1),
      new THREE.MeshLambertMaterial({ color: '#cbb78f' })
    );

  const STATE = { IDLE: 'idle', WALKING: 'walking' };

  const MEETING_SPOTS = [
    { x: -1.5, z: -4.6, ry:  Math.atan2( 1.5, -2.2), occupiedBy: null },
    { x:  1.5, z: -4.6, ry:  Math.atan2(-1.5, -2.2), occupiedBy: null },
  ];

  function findFreeMeetingSpot() {
    const free = MEETING_SPOTS.filter(s => s.occupiedBy === null);
    if (!free.length) return null;
    return free[Math.floor(Math.random() * free.length)];
  }

  function pickOrchestratorVisitTarget(agents) {
    if (!agents.length) return null;
    for (let attempt = 0; attempt < 8; attempt++) {
      const a = agents[Math.floor(Math.random() * agents.length)];
      const h = a.userData.home;
      const angle = Math.random() * Math.PI * 2;
      const r = 1.4 + Math.random() * 0.5;
      const x = h.x + Math.cos(angle) * r;
      const z = h.z + Math.sin(angle) * r;
      if (z < -7.0 || z >  2.2) continue;
      if (x < -5.5 || x >  5.5) continue;
      return { x, z, ry: Math.atan2(h.x - x, h.z - z) };
    }
    const a = agents[Math.floor(Math.random() * agents.length)];
    return { x: 0, z: Math.max(-6.0, Math.min(0.0, a.userData.home.z)), ry: Math.atan2(a.userData.home.x, a.userData.home.z - 0) };
  }

  function smoothRotate(curr, target, factor) {
    let d = target - curr;
    while (d >  Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    return curr + d * Math.min(1, factor);
  }

  function planPath(from, to) {
    return [{ x: to.x, z: to.z, ry: to.ry }];
  }

  function tickCharacter(g, now, dt, agents) {
    const ud = g.userData;

    if (ud.state === STATE.IDLE) {
      if (now >= ud.nextActionTime) {
        let final = null;
        if (ud.role === 'orchestrator') {
          if (ud.atHome) {
            final = pickOrchestratorVisitTarget(agents);
            if (!final) {
              ud.nextActionTime = now + 2500;
            } else {
              ud.atHome = false;
            }
          } else {
            final = { x: ud.home.x, z: ud.home.z, ry: ud.home.ry };
          }
        } else {
          if (ud.atHome) {
            const spot = findFreeMeetingSpot();
            if (!spot) {
              ud.nextActionTime = now + 3000 + Math.random() * 4000;
            } else {
              spot.occupiedBy = ud.idx;
              ud.currentSpot = spot;
              final = { x: spot.x, z: spot.z, ry: spot.ry };
              ud.atHome = false;
            }
          } else {
            if (ud.currentSpot) { ud.currentSpot.occupiedBy = null; ud.currentSpot = null; }
            final = { x: ud.home.x, z: ud.home.z, ry: ud.home.ry };
          }
        }
        if (final) {
          ud.pathQueue = planPath({ x: g.position.x, z: g.position.z }, final);
          ud.target = ud.pathQueue.shift();
          ud.state = STATE.WALKING;
        }
      }
    } else if (ud.state === STATE.WALKING) {
      const dx = ud.target.x - g.position.x;
      const dz = ud.target.z - g.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < 0.12) {
        g.position.x = ud.target.x;
        g.position.z = ud.target.z;
        if (ud.pathQueue && ud.pathQueue.length > 0) {
          ud.target = ud.pathQueue.shift();
        } else {
          g.rotation.y = smoothRotate(g.rotation.y, ud.target.ry, 0.6);
          ud.state = STATE.IDLE;
          ud.atHome = (Math.abs(ud.target.x - ud.home.x) < 0.5 && Math.abs(ud.target.z - ud.home.z) < 0.5);
          if (ud.role === 'orchestrator') {
            ud.nextActionTime = now + (ud.atHome ? 4000 + Math.random() * 5000 : 2200 + Math.random() * 2400);
          } else {
            ud.nextActionTime = now + (ud.atHome ? 9000 + Math.random() * 12000 : 3500 + Math.random() * 3500);
          }
        }
      } else {
        const step = ud.speed * dt;
        g.position.x += (dx / dist) * step;
        g.position.z += (dz / dist) * step;
        const targetRy = Math.atan2(dx, dz);
        g.rotation.y = smoothRotate(g.rotation.y, targetRy, dt * 8);
      }
    }

    if (ud.state === STATE.WALKING) {
      const stride = now * 0.014 + ud.idx * 0.4;
      g.position.y = Math.abs(Math.sin(stride)) * 0.18;
      if (ud.inner) ud.inner.rotation.z = Math.sin(stride) * 0.07;
    } else {
      g.position.y = Math.sin(now * 0.002 + ud.idx * 0.7) * 0.05;
      if (ud.inner) ud.inner.rotation.z *= 0.86;
    }
  }

  async function initRoom() {
    const container = document.querySelector('.hero-room');
    if (!container) return;
    const canvas = container.querySelector('#hero-room-canvas');

    if (!probe.getContext('webgl2') && !probe.getContext('webgl')) {
      const ld = container.querySelector('.hero-room-loading');
      if (ld) ld.textContent = 'WebGL not supported';
      return;
    }

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    } catch (e) { return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog('#f4ecd6', 42, 70);

    const camera = new THREE.PerspectiveCamera(42, 16 / 9, 0.1, 100);
    camera.position.set(0, 9, 19);
    camera.lookAt(0, 3, -3);

    scene.add(new THREE.AmbientLight(0xffffff, 0.95));
    const sun = new THREE.DirectionalLight(0xfff1d6, 0.95);
    sun.position.set(-8, 14, 8);
    scene.add(sun);
    const fillLight = new THREE.DirectionalLight(0xc7e1ff, 0.45);
    fillLight.position.set(10, 6, 10);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffd8a8, 0.3);
    rimLight.position.set(0, 4, -10);
    scene.add(rimLight);

    buildOffice(scene);

    const cards = document.querySelectorAll('.ag-card');
    const agents = [];
    let orchestrator = null;

    cards.forEach(card => {
      const svg = card.querySelector('.ag-stage svg');
      if (!svg) return;
      const nameEl = card.querySelector('.ag-name');
      if (!nameEl) return;
      const key = nameEl.textContent.trim().toLowerCase();
      const pixels = extractPixels(svg);

      const place = PLACEMENTS[key];
      if (!place) return;

      const built = buildCharacter(pixels);
      const wrapper = built.wrapper;
      wrapper.position.set(place.x, 0, place.z);
      wrapper.rotation.y = place.ry || 0;
      if (place.scale) wrapper.scale.setScalar(place.scale);

      const isOrch = (key === 'orchestrator');
      wrapper.userData = {
        inner: built.inner,
        role: isOrch ? 'orchestrator' : 'agent',
        home: { x: place.x, z: place.z, ry: place.ry || 0 },
        state: STATE.IDLE,
        atHome: true,
        target: null,
        pathQueue: null,
        currentSpot: null,
        nextActionTime: performance.now() + 1500 + Math.random() * 7000,
        speed: isOrch ? 1.7 : 1.3,
        idx: 0,
        displayName: key,
      };
      scene.add(wrapper);

      if (isOrch) {
        orchestrator = wrapper;
      } else {
        wrapper.userData.idx = agents.length;
        agents.push(wrapper);
      }
    });

    if (orchestrator) orchestrator.userData.idx = agents.length;

    const stage = container.querySelector('.hero-room-stage');
    const tooltip = document.createElement('div');
    tooltip.className = 'hero-room-tooltip';
    stage.appendChild(tooltip);

    const hoverTargets = [];
    agents.forEach(a => hoverTargets.push(a));
    if (orchestrator) hoverTargets.push(orchestrator);
    const sceneDesks = scene.userData.desks || {};
    Object.values(sceneDesks).forEach(d => hoverTargets.push(d));

    const chatLayer = document.createElement('div');
    chatLayer.className = 'hero-chat-layer';
    stage.appendChild(chatLayer);

    const bubblesByWrapper = new Map();
    function buildBubble(wrapper) {
      const key = wrapper.userData.displayName;
      const colorKey = AGENT_COLOR_KEY[key] || 'orchestrator';
      const bubble = document.createElement('div');
      bubble.className = 'hero-chat-3d';
      bubble.style.setProperty('--c', `var(--c-${colorKey})`);
      const name = document.createElement('span');
      name.className = 'hero-chat-3d-name';
      name.textContent = key;
      const text = document.createElement('span');
      text.className = 'hero-chat-3d-text';
      bubble.appendChild(name);
      bubble.appendChild(text);
      chatLayer.appendChild(bubble);
      bubblesByWrapper.set(wrapper, {
        el: bubble,
        textEl: text,
        visibleUntil: 0,
        lastLineIdx: -1,
      });
    }
    agents.forEach(buildBubble);
    if (orchestrator) buildBubble(orchestrator);

    function isMeeting(wrapper) {
      const ud = wrapper.userData;
      if (ud.state !== STATE.IDLE) return false;
      if (ud.role === 'orchestrator') return !ud.atHome;
      return ud.currentSpot !== null;
    }

    function pickAndSpeak() {
      const now = performance.now();
      const candidates = [];
      if (orchestrator && isMeeting(orchestrator)) candidates.push(orchestrator);
      agents.forEach(a => { if (isMeeting(a)) candidates.push(a); });
      const free = candidates.filter(w => {
        const b = bubblesByWrapper.get(w);
        return b && now >= b.visibleUntil;
      });
      if (free.length === 0) {
        setTimeout(pickAndSpeak, 700 + Math.random() * 900);
        return;
      }
      const speaker = free[Math.floor(Math.random() * free.length)];
      const key = speaker.userData.displayName;
      const lines = AGENT_LINES[key] || ['…'];
      const b = bubblesByWrapper.get(speaker);
      let idx = Math.floor(Math.random() * lines.length);
      if (lines.length > 1 && idx === b.lastLineIdx) idx = (idx + 1) % lines.length;
      b.lastLineIdx = idx;
      b.textEl.textContent = lines[idx];
      b.el.classList.add('show');
      const dwell = 2400 + Math.random() * 1600;
      b.visibleUntil = now + dwell;
      setTimeout(pickAndSpeak, 900 + Math.random() * 1200);
    }

    const _projTmp = new THREE.Vector3();
    function updateChatBubbles() {
      const rect = stage.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      const now = performance.now();
      bubblesByWrapper.forEach((b, wrapper) => {
        const showing = b.el.classList.contains('show');
        if (showing && (!isMeeting(wrapper) || now >= b.visibleUntil)) {
          b.el.classList.remove('show');
          return;
        }
        if (!showing) return;
        _projTmp.set(wrapper.position.x, 3.2, wrapper.position.z);
        _projTmp.project(camera);
        if (_projTmp.z < -1 || _projTmp.z > 1) {
          b.el.classList.remove('show');
          return;
        }
        const px = (_projTmp.x * 0.5 + 0.5) * w;
        const py = (-_projTmp.y * 0.5 + 0.5) * h;
        b.el.style.transform = `translate(calc(-50% + ${px}px), calc(-120% + ${py}px))`;
      });
    }

    setTimeout(pickAndSpeak, 1800);

    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();

    function findNamedAncestor(obj) {
      let cur = obj;
      while (cur) {
        if (cur.userData && cur.userData.displayName) return cur;
        cur = cur.parent;
      }
      return null;
    }

    canvas.addEventListener('mousemove', (ev) => {
      const rect = canvas.getBoundingClientRect();
      const x = ev.clientX - rect.left;
      const y = ev.clientY - rect.top;
      ndc.x = (x / rect.width) * 2 - 1;
      ndc.y = -(y / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(hoverTargets, true);
      let named = null;
      for (const h of hits) {
        named = findNamedAncestor(h.object);
        if (named) break;
      }
      if (named) {
        tooltip.textContent = named.userData.displayName;
        tooltip.style.left = x + 'px';
        tooltip.style.top  = y + 'px';
        tooltip.classList.add('show');
      } else {
        tooltip.classList.remove('show');
      }
    });
    canvas.addEventListener('mouseleave', () => {
      tooltip.classList.remove('show');
    });

    container.classList.add('ready');

    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let running = true;
    let lastT = performance.now();

    function tick(now) {
      if (!running) return;
      requestAnimationFrame(tick);
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;

      if (!reduceMotion) {
        agents.forEach(g => tickCharacter(g, now, dt, agents));
        if (orchestrator) tickCharacter(orchestrator, now, dt, agents);

        const sway = Math.sin(now * 0.00025);
        camera.position.x = sway * 1.6;
        camera.position.y = 9 + Math.sin(now * 0.00035) * 0.3;
        camera.lookAt(0, 3, -3);
      } else {
        agents.forEach(g => {
          g.position.set(g.userData.home.x, 0, g.userData.home.z);
          g.rotation.y = g.userData.home.ry;
        });
        if (orchestrator) {
          orchestrator.position.set(orchestrator.userData.home.x, 0, orchestrator.userData.home.z);
          orchestrator.rotation.y = orchestrator.userData.home.ry;
        }
      }

      updateChatBubbles();
      renderer.render(scene, camera);
    }

    function resize() {
      const stage = container.querySelector('.hero-room-stage');
      if (!stage) return;
      const r = stage.getBoundingClientRect();
      const w = Math.max(1, r.width);
      const h = Math.max(1, r.height);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resize();
    new ResizeObserver(resize).observe(container);

    requestAnimationFrame(tick);

    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        const wasRunning = running;
        running = e.isIntersecting;
        if (running && !wasRunning) { lastT = performance.now(); requestAnimationFrame(tick); }
      });
    }, { threshold: 0.05 });
    io.observe(container);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => { initRoom().catch(() => {}); });
  } else {
    initRoom().catch(() => {});
  }
</script>

</body>
</html>
