<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero — Variant A · Dense Particles · Harry Hein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff; --canvas:#fafafa; --inset:#f4f4f5;
    --ink:#0a0a0a; --ink-soft:#1f1f22; --muted:#5a5a5f; --dim:#737378;
    --hairline:#e7e7e8;
    --violet:#7c3aed; --amber:#a16207; --ps-blue:#0066cc;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --pill:9999px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;}
  body{background:var(--paper);color:var(--ink-soft);font-family:var(--sans);font-size:17px;line-height:1.55;letter-spacing:-0.012em;}

  .variant-badge{
    position:fixed;top:14px;left:14px;z-index:50;
    background:var(--ink);color:#fff;
    font-family:var(--mono);font-size:10px;
    letter-spacing:0.14em;text-transform:uppercase;
    padding:8px 14px;border-radius:var(--pill);
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  .variant-badge b{color:#a78bfa;font-weight:600;letter-spacing:0.08em;}

  .hero{
    position:relative;
    min-height:100vh;
    padding:112px 28px 64px;
    text-align:center;
    background:var(--paper);
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }

  /* Layer 1 — ambient breathing pulse */
  .hero-pulse{
    position:absolute;inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 70% 50% at 50% 40%, rgba(124,58,237,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 50% 60%, rgba(161,98,7,0.04) 0%, transparent 70%);
    animation:heroBreathe 9s ease-in-out infinite alternate;
  }
  @keyframes heroBreathe{
    from{opacity:0.65;transform:scale(1);}
    to{opacity:1;transform:scale(1.06);}
  }

  .hero-particles{
    position:absolute;inset:0;
    pointer-events:none;display:block;
  }

  .hero-inner{
    position:relative;z-index:2;
    max-width:1200px;margin:0 auto;
  }
  .hero-eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--canvas);border:1px solid var(--hairline);
    padding:6px 14px;border-radius:var(--pill);
    font-family:var(--mono);font-size:12px;color:var(--muted);
    margin-bottom:32px;
  }
  .hero-eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:#16a34a;box-shadow:0 0 8px rgba(22,163,74,0.6);
  }
  h1{
    font-size:clamp(56px,9vw,128px);
    font-weight:600;letter-spacing:-0.035em;
    line-height:0.98;color:var(--ink);
    margin-bottom:26px;
  }
  h1 em{font-style:normal;color:var(--muted);}
  h1 .kiss{color:var(--violet);}
  .hero-sub{
    font-size:clamp(18px,1.8vw,22px);
    font-weight:400;color:var(--muted);
    max-width:620px;margin:0 auto 40px;line-height:1.5;
  }

  .palette{
    max-width:560px;margin:0 auto;
    background:var(--paper);border:1px solid var(--hairline);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,0.06);
    padding:6px;text-align:left;
  }
  .palette-search{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;border-radius:14px;
    background:var(--inset);
  }
  .palette-search svg{width:14px;height:14px;color:var(--muted);}
  .palette-search input{
    flex:1;background:transparent;border:0;outline:0;
    font-family:var(--sans);font-size:14px;color:var(--ink-soft);
  }
  .palette-search kbd{
    font-family:var(--mono);font-size:10px;
    background:var(--paper);border:1px solid var(--hairline);
    padding:3px 7px;border-radius:5px;color:var(--muted);
  }
  .palette-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;border-radius:12px;margin-top:4px;
  }
  .palette-row.selected{background:rgba(124,58,237,0.08);}
  .row-icon{
    width:28px;height:28px;border-radius:8px;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,#7c3aed,#0066cc);
  }
  .palette-name{flex:1;font-size:13.5px;color:var(--ink);font-weight:500;}
  .palette-meta{
    font-family:var(--mono);font-size:10px;color:var(--muted);
    letter-spacing:0.06em;text-transform:uppercase;
  }

  @media (prefers-reduced-motion:reduce){
    .hero-pulse{animation:none;}
  }
</style>
</head>
<body>

<div class="variant-badge"><b>Variant A</b> &middot; Dense &middot; 140 particles</div>

<section class="hero">
  <div class="hero-pulse" aria-hidden="true"></div>
  <canvas class="hero-particles" id="particles" aria-hidden="true"></canvas>

  <div class="hero-inner">
    <div class="hero-eyebrow"><span class="dot"></span>Senior Product Designer · Available 2026</div>
    <h1>I <span class="kiss">KISS</span> your <em>product.</em></h1>
    <p class="hero-sub">Seven years simplifying enterprise software.</p>

    <div class="palette">
      <div class="palette-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input placeholder="What do you want to do? Ask anything…" readonly>
        <kbd>⌘ K</kbd>
      </div>
      <div class="palette-row selected">
        <span class="row-icon">AH</span>
        <span class="palette-name">Stop building AI tools. Build AI teams.</span>
        <span class="palette-meta">Agentic Design</span>
      </div>
      <div class="palette-row">
        <span class="row-icon" style="background:linear-gradient(135deg,#a16207,#dc2626);">DS</span>
        <span class="palette-name">Three platforms. One source of truth.</span>
        <span class="palette-meta">Design System</span>
      </div>
    </div>
  </div>
</section>

<script>
(() => {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let particles = [];
  let running = true;

  const COUNT = 140;
  const COLORS = [
    'rgba(255,240,220,X)','rgba(255,240,220,X)','rgba(255,240,220,X)',
    'rgba(255,240,220,X)','rgba(255,240,220,X)','rgba(255,240,220,X)',
    'rgba(255,240,220,X)','rgba(255,240,220,X)','rgba(255,240,220,X)',
    'rgba(255,240,220,X)','rgba(255,240,220,X)','rgba(255,240,220,X)',
    'rgba(255,240,220,X)','rgba(255,240,220,X)','rgba(255,240,220,X)',
    'rgba(255,240,220,X)','rgba(255,240,220,X)','rgba(255,240,220,X)',
    'rgba(124,58,237,X)','rgba(161,98,7,X)',
  ];

  function rand(a, b){ return a + Math.random() * (b - a); }

  function resize(){
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawn(){
    particles = [];
    for (let i = 0; i < COUNT; i++){
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rand(0.6, 2.2),
        vx: rand(-0.15, 0.15),
        vy: rand(-0.30, -0.05),
        a: rand(0.18, 0.65),
        twinkle: Math.random() * Math.PI * 2,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
      });
    }
  }

  function tick(){
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    const t = performance.now() * 0.001;

    for (const p of particles){
      p.x += p.vx;
      p.y += p.vy;
      if (p.y < -4){ p.y = H + 4; p.x = Math.random() * W; }
      if (p.x < -4) p.x = W + 4;
      if (p.x > W + 4) p.x = -4;

      const tw = Math.sin(t * 1.2 + p.twinkle) * 0.25 + 0.75;
      const alpha = p.a * tw;
      ctx.fillStyle = p.color.replace('X', alpha.toFixed(3));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }

  function start(){
    resize();
    spawn();
    if (reduce){
      ctx.clearRect(0, 0, W, H);
      for (const p of particles){
        ctx.fillStyle = p.color.replace('X', p.a.toFixed(3));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      return;
    }
    requestAnimationFrame(tick);
  }

  new ResizeObserver(() => { resize(); spawn(); }).observe(canvas);

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const wasRunning = running;
      running = e.isIntersecting;
      if (running && !wasRunning && !reduce) requestAnimationFrame(tick);
    });
  }, { threshold: 0.05 });
  io.observe(canvas);

  start();
})();
</script>

</body>
</html>
